<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Citas</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header class="navbar">
        <div class="container">
            <a class="navbar-brand" th:href="@{/inicio}">Hospital</a>
            <nav class="navbar-nav">
                <a class="nav-link" th:href="@{/inicio}">Inicio</a>
            </nav>
        </div>
    </header>

    <div class="page-wrapper">
        <main class="main-content" role="main">
            <div class="container">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                    <a th:href="@{/citas/nueva}" class="btn btn-primary">Nueva Cita</a>
                </div>

                <form th:if="${usuario.rol == 'ADMIN'}" th:action="@{/citas}" method="get" class="filter-form"
                      style="display: flex; flex-wrap: wrap; gap: 1rem; align-items: flex-end; margin-bottom: 1rem; padding: 1rem; background: var(--surface); border-radius: var(--radius);">
                    <div class="form-group" style="margin: 0;">
                        <label for="estado" class="form-label">Estado</label>
                        <select id="estado" name="estado" class="form-input">
                            <option value="">Todos</option>
                            <option value="PENDIENTE">Pendiente</option>
                            <option value="CONFIRMADA">Confirmada</option>
                            <option value="CANCELADA">Cancelada</option>
                        </select>
                    </div>

                    <div class="form-group" style="margin: 0;">
                        <label for="medicoIdFiltro" class="form-label">Médico</label>
                        <select id="medicoIdFiltro" name="medicoId" class="form-input">
                            <option value="">Todos</option>
                            <option th:each="m : ${medicos}" th:value="${m.id}"
                                    th:text="${m.nombre} + ' ' + ${m.apellido}"></option>
                        </select>
                    </div>

                    <div class="form-group" style="margin: 0;">
                        <label for="especialidad" class="form-label">Especialidad</label>
                        <input type="text" id="especialidad" name="especialidad" class="form-input"
                               placeholder="Ej: Cardiología">
                    </div>

                    <div class="form-group" style="margin: 0;">
                        <label for="fechaDesdeStr" class="form-label">Desde</label>
                        <input type="date" id="fechaDesdeStr" name="fechaDesdeStr" class="form-input">
                    </div>

                    <div class="form-group" style="margin: 0;">
                        <label for="fechaHastaStr" class="form-label">Hasta</label>
                        <input type="date" id="fechaHastaStr" name="fechaHastaStr" class="form-input">
                    </div>

                    <button type="submit" class="btn btn-primary">Filtrar</button>
                    <a th:href="@{/citas}" class="btn btn-outline">Limpiar</a>
                </form>

                <table class="table">
                    <thead>
                        <tr>
                            <th>Médico</th>
                            <th>Especialidad</th>
                            <th>Fecha</th>
                            <th>Hora</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr th:if="${#lists.isEmpty(citas)}">
                            <td colspan="6" class="text-center">No hay citas registradas</td>
                        </tr>

                        <tr th:each="cita : ${citas}">
                            <td th:text="${cita.medico.nombre} + ' ' + ${cita.medico.apellido}"></td>
                            <td th:text="${cita.medico.especialidad}"></td>
                            <td th:text="${cita.fecha}"></td>
                            <td th:text="${cita.hora}"></td>
                            <td>
                                <span th:text="${cita.estado}"></span>
                            </td>
                            <td>
                                <a th:if="${usuario.rol == 'ADMIN' and cita.estado == 'PENDIENTE'}" th:href="@{/citas/confirmar/{id}(id=${cita.id})}" class="btn btn-success">Confirmar</a>
                                <a th:if="${cita.estado != 'CANCELADA'}" th:href="@{/citas/cancelar/{id}(id=${cita.id})}" class="btn btn-danger" onclick="return confirm('¿Estás seguro de que deseas cancelar esta cita?')">Cancelar</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</body>
</html>
