<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nueva Cita</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>

        .info-box {
            background-color: #e3f2fd;
            border-left: 4px solid #2196F3;
            padding: 1rem;
            margin-bottom: 1.5rem;
            border-radius: 4px;
        }

        .medico-card {
            background-color: #f9f9f9;
            padding: 1rem;
            border-radius: 4px;
            margin-bottom: 1rem;
            border-left: 4px solid #2196F3;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .medico-card:hover {
            background-color: #f0f7ff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transform: translateY(-1px);
        }

        .medico-card.active {
            background-color: #e3f2fd;
            border-left-color: #1976d2;
            box-shadow: 0 2px 8px rgba(33, 150, 243, 0.20);
        }

        .medico-card strong {
            display: block;
            color: #333;
            margin-bottom: 0.25rem;
        }

        .medico-card small {
            color: #666;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-top: 2rem;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #2196F3;
        }

        .horario-grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fill, minmax(150px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .horario-option {
            padding: 1rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: white;
            user-select: none;
        }

        .horario-option:hover {
            border-color: #2196F3;
            background-color: #e3f2fd;
            transform: translateY(-2px);
            box-shadow: 0 3px 8px rgba(33, 150, 243, 0.15);
        }

        .horario-option.selected {
            border-color: #1976d2;
            background-color: #1976d2;
            color: white;
            font-weight: 600;
            box-shadow: 0 3px 10px rgba(25, 118, 210, 0.25);
        }

        .horario-option.selected .horario-tiempo {
            color: white;
        }

        .horario-option.selected .horario-disponible {
            color: #e3f2fd;
        }

        .horario-tiempo {
            font-weight: 600;
            color: #333;
            font-size: 1rem;
            margin-bottom: 0.35rem;
        }

        .horario-disponible {
            color: #666;
            font-size: 0.80rem;
        }

        .no-horarios {
            padding: 2rem;
            text-align: center;
            color: #777;
            background-color: #f5f5f5;
            border-radius: 6px;
            border: 1px solid #ddd;
        }

        .medicos-grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .fecha-selector {
            background-color: #f9f9f9;
            padding: 1.5rem;
            border-radius: 4px;
            margin-bottom: 2rem;
        }

        .cargando-horarios {
            padding: 2rem;
            text-align: center;
            color: #666;
        }

        .duracion-info {
            background-color: #f5f9ff;
            border-left: 4px solid #2196F3;
            padding: 0.8rem 1rem;
            margin-bottom: 1rem;
            border-radius: 4px;
            color: #555;
            font-size: 0.9rem;
        }

    </style>
</head>

<body>

<div class="page-wrapper">

    <header class="navbar" role="banner">

        <div class="container">

            <a
                class="navbar-brand"
                th:href="@{/inicio}">
                Hospital
            </a>

            <nav
                class="navbar-nav"
                aria-label="Main navigation">

                <a
                    class="nav-link"
                    th:href="@{/inicio}">
                    Inicio
                </a>

                <a
                    class="nav-link"
                    th:href="@{/citas}">
                    Mis Citas
                </a>

                <form
                    th:action="@{/logout}"
                    method="post"
                    class="inline-form">

                    <button
                        type="submit"
                        class="btn btn-link nav-link p-0">
                        Cerrar Sesión
                    </button>

                </form>

            </nav>

        </div>

    </header>

    <main
        class="main-content"
        role="main">

        <div class="container">

            <div class="page-header">
                <h1>Reservar Nueva Cita</h1>
            </div>


            <!-- MENSAJE DE ERROR -->

            <div
                th:if="${error}"
                class="alert alert-danger">

                <strong>Error:</strong>

                <span th:text="${error}"></span>

            </div>


            <div class="card">

                <div class="card-body">

                    <form
                        th:action="@{/citas/reservar}"
                        method="post"
                        id="formCita">


                        <h3 class="section-title">
                            Paso 1: Selecciona una Fecha
                        </h3>


                        <div class="fecha-selector">

                            <div class="form-group">

                                <label
                                    for="fechaSeleccionada"
                                    class="form-label">

                                    <span style="color: red;">
                                        *
                                    </span>

                                    Fecha

                                </label>


                                <input
                                    type="date"
                                    id="fechaSeleccionada"
                                    class="form-input"
                                    required>

                            </div>

                        </div>

                        <h3 class="section-title">
                            Paso 2: Selecciona un Médico
                        </h3>


                        <div
                            class="medicos-grid"
                            id="medicosContainer">


                            <div
                                th:each="medico : ${medicos}"
                                class="medico-card"

                                th:onclick="
                                    'seleccionarMedico(this, '
                                    + ${medico.id}
                                    + ')'">


                                <strong
                                    th:text="
                                        ${medico.nombre}
                                        + ' '
                                        + ${medico.apellido}">
                                </strong>


                                <small
                                    th:text="${medico.especialidad}">
                                </small>


                                <small
                                    style="
                                        display: block;
                                        margin-top: 0.25rem;
                                    "

                                    th:text="
                                        '📞 '
                                        + ${medico.telefono}">
                                </small>

                            </div>

                        </div>

                        <div
                            id="horariosDiv"
                            style="display: none;">


                            <h3 class="section-title">
                                Paso 3: Selecciona la Hora de tu Cita
                            </h3>


                            <div class="duracion-info">

                                Las citas tienen una duración de
                                <strong>1 hora</strong>.

                                Selecciona el horario que mejor
                                se adapte a tu disponibilidad.

                            </div>


                            <div id="horariosContent">
                            </div>

                        </div>

                        <input
                            type="hidden"
                            id="disponibilidadId"
                            name="disponibilidadId"
                            value="">



                        <input
                            type="hidden"
                            id="horaSeleccionada"
                            name="horaSeleccionada"
                            value="">

                        <div
                            style="
                                display: flex;
                                gap: 0.75rem;
                                margin-top: 2rem;
                            ">


                            <button
                                type="submit"
                                class="btn btn-primary"
                                id="submitBtn"
                                disabled>

                                Reservar Cita

                            </button>


                            <a
                                th:href="@{/citas}"
                                class="btn btn-outline">

                                Cancelar

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </main>

    <footer class="footer">

        <div class="container">
            Hospital - Sistema de Gestión
        </div>

    </footer>

</div>

<script th:inline="javascript">

    let medicoSeleccionado = null;

    let fechaSeleccionada = null;

    let disponibilidadSeleccionada = null;

    let horaSeleccionada = null;

    const todasDisponibilidades =
        /*[[${disponibilidades}]]*/ [];


    const inputFecha =
        document.getElementById('fechaSeleccionada');


    const hoy = new Date();

    const anio = hoy.getFullYear();

    const mes =
        String(hoy.getMonth() + 1)
            .padStart(2, '0');

    const dia =
        String(hoy.getDate())
            .padStart(2, '0');


    inputFecha.min =
        anio + '-' + mes + '-' + dia;

    inputFecha.addEventListener(
        'change',

        function (e) {

            fechaSeleccionada =
                e.target.value;

            medicoSeleccionado = null;

            disponibilidadSeleccionada = null;

            horaSeleccionada = null;

            document
                .querySelectorAll('.medico-card')
                .forEach(el => {

                    el.classList.remove('active');

                });

            document
                .getElementById('horariosDiv')
                .style.display = 'none';

            limpiarHorarioSeleccionado();


            actualizarBoton();


            console.log(
                'Fecha seleccionada:',
                fechaSeleccionada
            );
        }
    );

    function seleccionarMedico(
        element,
        medicoId
    ) {

        if (!fechaSeleccionada) {

            alert(
                'Por favor selecciona una fecha primero'
            );

            return;
        }


        console.log(
            'Seleccionando médico:',
            medicoId,
            'para fecha:',
            fechaSeleccionada
        );

        document
            .querySelectorAll('.medico-card')
            .forEach(el => {

                el.classList.remove('active');

            });

        element.classList.add('active');


        medicoSeleccionado = medicoId;

        disponibilidadSeleccionada = null;

        horaSeleccionada = null;


        limpiarHorarioSeleccionado();


        actualizarBoton();

        cargarDisponibilidadesMedico(
            medicoId,
            fechaSeleccionada
        );
    }

    function cargarDisponibilidadesMedico(
        medicoId,
        fecha
    ) {

        console.log(
            'Buscando disponibilidades para médico:',
            medicoId,
            'fecha:',
            fecha
        );

        const disponibilidades =
            todasDisponibilidades.filter(d => {

                if (!d.medico) {
                    return false;
                }


                return (
                    Number(d.medico.id) === Number(medicoId)
                    &&
                    d.fecha === fecha
                    &&
                    d.activo === true
                );
            });


        console.log(
            'Disponibilidades encontradas:',
            disponibilidades
        );

        document
            .getElementById('horariosDiv')
            .style.display = 'block';

        if (disponibilidades.length === 0) {

            document
                .getElementById('horariosContent')
                .innerHTML =

                '<div class="no-horarios">'
                +
                'Este médico no tiene horarios disponibles '
                +
                'para esta fecha.'
                +
                '</div>';


            return;
        }

        cargarHorariosDeDisponibilidades(
            disponibilidades
        );
    }

    async function cargarHorariosDeDisponibilidades(
        disponibilidades
    ) {

        const contenedor =
            document.getElementById(
                'horariosContent'
            );


        contenedor.innerHTML =
            '<div class="cargando-horarios">'
            +
            'Cargando horarios disponibles...'
            +
            '</div>';


        try {

            const peticiones =
                disponibilidades.map(
                    disponibilidad => {

                        return fetch(
                            '/citas/horarios-disponibles'
                            +
                            '?disponibilidadId='
                            +
                            encodeURIComponent(
                                disponibilidad.id
                            )
                        )
                        .then(response => {

                            if (!response.ok) {

                                throw new Error(
                                    'Error HTTP '
                                    +
                                    response.status
                                );
                            }


                            return response.json();
                        });
                    }
                );

            const respuestas =
                await Promise.all(peticiones);

            let horarios = [];


            respuestas.forEach(lista => {

                horarios =
                    horarios.concat(lista);

            });

            horarios.sort(
                (a, b) => {

                    return a.horaInicio
                        .localeCompare(
                            b.horaInicio
                        );
                }
            );


            mostrarHorarios(horarios);


        } catch (error) {

            console.error(
                'Error cargando horarios:',
                error
            );


            contenedor.innerHTML =
                '<div class="no-horarios">'
                +
                'No se pudieron cargar los horarios '
                +
                'disponibles. Inténtalo nuevamente.'
                +
                '</div>';
        }
    }

    function mostrarHorarios(horarios) {

        const contenedor =
            document.getElementById(
                'horariosContent'
            );

        if (!horarios || horarios.length === 0) {

            contenedor.innerHTML =
                '<div class="no-horarios">'
                +
                'Este médico ya no tiene horarios libres '
                +
                'para esta fecha.'
                +
                '</div>';


            disponibilidadSeleccionada = null;

            horaSeleccionada = null;


            limpiarHorarioSeleccionado();


            actualizarBoton();

            return;
        }

        const grid =
            document.createElement('div');


        grid.className =
            'horario-grid';

        horarios.forEach(horario => {

            const boton =
                document.createElement('div');


            boton.className =
                'horario-option';

            boton.addEventListener(
                'click',

                function () {

                    seleccionarHorario(
                        boton,
                        horario.disponibilidadId,
                        horario.horaInicio
                    );
                }
            );

            const tiempo =
                document.createElement('div');


            tiempo.className =
                'horario-tiempo';


            tiempo.textContent =
                horario.horaInicio
                +
                ' - '
                +
                horario.horaFin;

            const disponible =
                document.createElement('div');


            disponible.className =
                'horario-disponible';


            disponible.textContent =
                'Disponible';


            boton.appendChild(tiempo);

            boton.appendChild(disponible);

            grid.appendChild(boton);
        });

        contenedor.innerHTML = '';

        contenedor.appendChild(grid);
    }

    function seleccionarHorario(
        element,
        disponibilidadId,
        hora
    ) {

        console.log(
            'Seleccionando disponibilidad:',
            disponibilidadId,
            'hora:',
            hora
        );

        document
            .querySelectorAll('.horario-option')
            .forEach(el => {

                el.classList.remove('selected');

            });

        element.classList.add('selected');

        disponibilidadSeleccionada =
            disponibilidadId;


        horaSeleccionada =
            hora;

        document
            .getElementById('disponibilidadId')
            .value =
            disponibilidadId;


        document
            .getElementById('horaSeleccionada')
            .value =
            hora;


        console.log(
            'Disponibilidad seleccionada:',
            disponibilidadSeleccionada
        );


        console.log(
            'Hora seleccionada:',
            horaSeleccionada
        );


        actualizarBoton();
    }

    function limpiarHorarioSeleccionado() {

        disponibilidadSeleccionada = null;

        horaSeleccionada = null;


        document
            .getElementById(
                'disponibilidadId'
            )
            .value = '';


        document
            .getElementById(
                'horaSeleccionada'
            )
            .value = '';
    }

    function actualizarBoton() {

        const submitBtn =
            document.getElementById(
                'submitBtn'
            );

        const completo =
            fechaSeleccionada
            &&
            medicoSeleccionado
            &&
            disponibilidadSeleccionada
            &&
            horaSeleccionada;


        submitBtn.disabled =
            !completo;


        console.log(
            'Estado formulario:',
            {
                fecha: fechaSeleccionada,
                medico: medicoSeleccionado,
                disponibilidad:
                    disponibilidadSeleccionada,
                hora: horaSeleccionada,
                habilitado: completo
            }
        );
    }

    document
        .getElementById('formCita')
        .addEventListener(
            'submit',

            function (e) {

                const disponibilidadId =
                    document
                        .getElementById(
                            'disponibilidadId'
                        )
                        .value;


                const hora =
                    document
                        .getElementById(
                            'horaSeleccionada'
                        )
                        .value;


                console.log(
                    'Enviando reserva:',
                    {
                        disponibilidadId:
                            disponibilidadId,
                        horaSeleccionada:
                            hora
                    }
                );

                if (
                    !disponibilidadId
                    ||
                    !hora
                ) {

                    e.preventDefault();


                    alert(
                        'Por favor selecciona '
                        +
                        'una fecha, un médico '
                        +
                        'y un horario.'
                    );


                    return false;
                }

                document
                    .getElementById(
                        'submitBtn'
                    )
                    .disabled = true;


                return true;
            }
        );


    console.log(
        'Formulario de citas cargado.'
    );


    console.log(
        'Disponibilidades recibidas:',
        todasDisponibilidades.length
    );

</script>

</body>
</html>
